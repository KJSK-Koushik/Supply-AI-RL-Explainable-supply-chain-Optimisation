# SUPPLIER MASTER TABLE  --  *** FULLY SYNTHETIC ***
#
# No public retail dataset contains supplier lead times, fill rates or
# contract prices; that data is commercially confidential. These values are
# hand-authored to span the classic cost/speed/reliability trade-off found in
# the inventory-management literature. This file must be cited as synthetic in
# the report. Every other calibrated number in this project comes from real
# UCI Online Retail II data.

suppliers:
  - id: 0
    name: "EconoSource"
    archetype: "cheap but slow"
    cost_multiplier: 1.00       # applied to the product's base unit cost
    lead_time_min: 5            # days, inclusive
    lead_time_max: 8
    lead_time_mode: 6           # triangular distribution peak
    fill_rate_mean: 0.90        # fraction of the ordered quantity actually shipped
    fill_rate_std: 0.06
    min_order_qty: 100
    fixed_order_cost: 20.0
    outage_prob: 0.004          # per-day chance of going offline
    outage_duration_range: [3, 7]

  - id: 1
    name: "RapidTrade"
    archetype: "fast but expensive"
    cost_multiplier: 1.35
    lead_time_min: 1
    lead_time_max: 3
    lead_time_mode: 2
    fill_rate_mean: 0.98
    fill_rate_std: 0.02
    min_order_qty: 20
    fixed_order_cost: 45.0
    outage_prob: 0.001
    outage_duration_range: [1, 3]

  - id: 2
    name: "MidWay Supply"
    archetype: "middling but unreliable"
    cost_multiplier: 1.15
    lead_time_min: 3
    lead_time_max: 5
    lead_time_mode: 4
    fill_rate_mean: 0.80
    fill_rate_std: 0.12
    min_order_qty: 50
    fixed_order_cost: 30.0
    outage_prob: 0.012          # the flaky one - drives interesting agent behaviour
    outage_duration_range: [5, 10]

# Economics shared across suppliers. Base unit cost is derived per product from
# the real UCI median selling price using this margin assumption.
economics:
  gross_margin: 0.45            # unit_cost = price * (1 - gross_margin)
  holding_cost_per_unit_day: 0.02   # as a fraction of unit cost
  stockout_penalty_multiplier: 1.5  # penalty per unmet unit, x gross profit
  backlog_enabled: true
  backlog_carryover_fraction: 0.6   # 60% of unmet demand waits, 40% is lost
  warehouse_capacity_per_product: 2000
