# SUPPLIER MASTER TABLE  --  *** FULLY SYNTHETIC ***
#
# No public retail dataset contains supplier lead times, fill rates or
# contract prices; that data is commercially confidential. These values are
# hand-authored to span the classic cost/speed/reliability trade-off found in
# the inventory-management literature. This file must be cited as synthetic in
# the report. Every other calibrated number in this project comes from real
# UCI Online Retail II data.

suppliers:
  - id: 0
    name: "EconoSource"
    archetype: "cheap but slow"
    cost_multiplier: 1.00       # applied to the product's base unit cost
    lead_time_min: 5            # days, inclusive
    lead_time_max: 8
    lead_time_mode: 6           # triangular distribution peak
    fill_rate_mean: 0.90        # fraction of the ordered quantity actually shipped
    fill_rate_std: 0.06
    min_order_qty: 100
    fixed_order_cost: 20.0
    outage_prob: 0.004          # per-day chance of going offline
    outage_duration_range: [3, 7]

  - id: 1
    name: "RapidTrade"
    archetype: "fast but expensive"
    cost_multiplier: 1.35
    lead_time_min: 1
    lead_time_max: 3
    lead_time_mode: 2
    fill_rate_mean: 0.98
    fill_rate_std: 0.02
    min_order_qty: 20
    fixed_order_cost: 45.0
    outage_prob: 0.001
    outage_duration_range: [1, 3]

  - id: 2
    name: "MidWay Supply"
    archetype: "middling but unreliable"
    cost_multiplier: 1.15
    lead_time_min: 3
    lead_time_max: 5
    lead_time_mode: 4
    fill_rate_mean: 0.80
    fill_rate_std: 0.12
    min_order_qty: 50
    fixed_order_cost: 30.0
    outage_prob: 0.012          # the flaky one - drives interesting agent behaviour
    outage_duration_range: [5, 10]

# Economics shared across suppliers. Base unit cost is derived per product from
# the real UCI median selling price using this margin assumption.
economics:
  gross_margin: 0.45            # unit_cost = price * (1 - gross_margin)

  # Daily holding cost as a fraction of unit cost. 0.0015/day is ~55%/year,
  # which is above the 20-30%/year cost-of-capital-plus-storage figure usually
  # quoted, and deliberately so: this retailer sells seasonal gift lines, where
  # markdown and obsolescence risk dominate pure storage cost. Anything near
  # 0.02/day (730%/year) is not defensible; anything near 0.0007 makes stock
  # effectively free to hold and collapses the ordering decision.
  holding_cost_per_unit_day: 0.0015

  stockout_penalty_multiplier: 1.5  # penalty per unmet unit, x gross profit
  backlog_enabled: true
  backlog_carryover_fraction: 0.6   # 60% of unmet demand waits, 40% is lost

  # ONE shared warehouse, not a private bin per product. This is the single
  # most important structural choice in the model. With per-product capacity,
  # products never compete and "order the maximum for everything" is optimal,
  # so the quantity decision is trivial and any fixed rule matches a learned
  # policy. With shared space, stocking one product denies room to another,
  # which is a genuine allocation problem -- and one that per-product (s,S)
  # rules cannot express, because each rule sees only its own product.
  #
  # 20,000 units is ~17 days of total average demand across the ten SKUs
  # (~1,175 units/day). Chosen by sweeping capacity against a constant-order
  # policy: below ~16,000 the business barely breaks even because the slowest
  # supplier's 8-day lead time cannot be covered, and above ~25,000 profit
  # plateaus and space stops binding, which collapses the allocation problem.
  warehouse_capacity_total: 20000

  # Goods that arrive when the warehouse is full are refused at the door. They
  # were already paid for, so this is a real loss -- which is what makes
  # ordering into a full pipeline expensive rather than merely wasteful.
  overflow_is_written_off: true

  # Stock still on the shelf when the episode ends is credited back at this
  # fraction of unit cost. Without it, a 180-day horizon treats every leftover
  # unit as a total write-off, which is an artefact of where we stopped
  # counting rather than a real cost, and biases the agent to under-order near
  # the end of an episode. 0.6 represents liquidation at a markdown.
  terminal_salvage_fraction: 0.6
