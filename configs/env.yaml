# Phase 2 - simulator configuration (placeholders finalised in Phase 2)

simulation:
  n_products: 10
  n_suppliers: 3
  episode_length: 180           # days per episode
  warmup_days: 14               # burn-in before reward counts
  initial_stock_days_of_cover: 10

action:
  # Order quantity is discretised into multiples of the product's mean daily
  # demand, so one action space works across fast and slow movers.
  order_buckets: [0.0, 0.5, 1.0, 2.0, 3.0, 5.0, 8.0]
  # -> action per product = (bucket index, supplier index)

observation:
  include:
    - on_hand_stock
    - in_transit_pipeline
    - days_of_cover
    - recent_demand_mean_7d
    - recent_demand_std_7d
    - demand_trend_14d
    - day_of_week_onehot
    - month_sin_cos
    - supplier_available_flags
    - supplier_expected_lead_time
    - supplier_recent_fill_rate
    - backlog
  normalise: true

reward:
  # reward = revenue - holding - purchase - ordering - stockout_penalty
  scale: 0.001                  # keeps returns in a range PPO likes
  clip: [-10.0, 10.0]

scenarios:
  enabled: true                 # scenario injector is first-class (needed by Phase 9)
  types: [demand_spike, supplier_delay, supplier_outage, price_shock]

seed: 42
